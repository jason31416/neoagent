# neoagent 配置示例 —— 复制为 config.toml 后填写真实值
# config.toml 已在 .gitignore 中，不会被提交

[llm]
# OpenAI 兼容接口：DeepSeek 官方 / 通义 / OpenAI / 自建均可
base_url = "https://api.deepseek.com"
api_key = "sk-xxxxxxxx"
model = "deepseek-chat"
# DeepSeek thinking 开关（deepseek-flash 默认开；开着多轮需回传 reasoning_content，
# 我们从消息库重渲染会丢，故默认显式关闭）。换供应商可设 "" 表示不传该参数。
thinking = "disabled"

[agent]
# 一次回复内最多连续调用多少轮工具（防失控）
max_tool_rounds = 12
# 时间线 token 预算：从最老端成组抛弃到装进预算（引用召回不计）
history_token_budget = 250000
# 每张图估算 token（计数器用；providers/tokens.py 可换精确实现）
image_token_estimate = 1024
# 记忆文件（M 自己用 write_file 维护，全文注入【记忆】段）
memory_file = "data/MEMORY.md"
# 身份文件（【它是谁】段全文；改它就改了 M 的人设与消息协议说明）
identity_file = "IDENTITY.md"
# 工作台：agent 的工作目录（exec 默认 cwd、相对路径基准、产出物落脚点）；
# 自动并入 files/exec/media 允许范围，无需再配 roots
workspace = "data/workspace"

[files]
# read_file / write_file 允许访问的根目录（防越界）
# 可写绝对路径或 ~；demo 想放开就加 "~"
allowed_roots = ["/Users/apple/Projects/misc/neoagent"]

[exec]
# 命令执行安全边界（demo 也必须有）
timeout_seconds = 60          # 单条命令超时
max_output_bytes = 20000      # stdout+stderr 超出截断
allowed_roots = ["/Users/apple/Projects/misc/neoagent"]  # cwd 允许范围
# 命中即拒绝的危险命令（正则，弱防线但必须有；不要拿它当唯一防线）
deny_patterns = ["\\bsudo\\b", "\\brm\\s+-rf\\b", "\\bmkfs\\b", "\\bdd\\s+of=/dev", "\\bshutdown\\b", "\\breboot\\b", ":\\(\\)\\s*\\{"]

[media]
max_bytes = 20971520            # 附件大小上限（20MB）
max_images_per_message = 4
download_quoted_media = false   # 引用里的媒体默认不下载

[vision]
provider = "deepseek-files"     # 可拆换：inline-base64
file_expires_seconds = 2592000  # 上传图片 30 天过期（0 = 永久）

[asr]
provider = "xiaomi-mimo"        # 语音转写供应商（可拆换）
api_key = ""                    # 小米 ASR token
base_url = "https://api.xiaomimimo.com/v1"
model = "mimo-v2.5-asr"
language = "auto"
max_audio_seconds = 300

[channels.weixin]
enabled = true
# iLink Bot API 凭据由扫码登录获得，落在 data/weixin/，此处无需配置

[channels.feishu]
enabled = false               # M2 再开
app_id = ""
app_secret = ""
