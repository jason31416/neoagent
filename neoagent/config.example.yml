# neoagent 配置（~/.neoagent/config.yml）
# 改完保存即生效；带"热改"标注的也能在聊天/控制台用指令改，两边殊途同归。
# 改坏了不用担心：加载出错会沿用旧值并提示，不会带着坏配置跑。

model:
  # OpenAI 兼容接口：DeepSeek 官方 / 通义 / OpenAI / 自建均可
  base_url: https://api.deepseek.com
  # 密钥也可以不落盘：环境变量 NEOAGENT_LLM_API_KEY 优先
  api_key: ""
  name: deepseek-flash
  # 思考档位（热改：/effort low 之类，改了下一条消息即生效）：
  # none=不思考 | minimal/low/medium/high/xhigh/ultra/max=思考，档位越高想得越多
  thinking: medium

# 人格在同目录 personality.md（用户可改；消息协议等内置提示词随代码仓库走）

memory:
  # 记忆库目录（相对本目录）：memory.md + 子文件 + old/ 归档
  dir: data/memory
  # 收工静默多久后整理一次记忆（秒）
  tidy_delay: 150
  # 定期整理的节律（秒）
  tidy_interval: 86400
  # 定期整理回看多少天
  tidy_lookback_days: 7
  # 整理用的思考档位（要省可降）
  tidy_thinking: medium
  # 一次整理最多连续调用多少轮工具
  tidy_tool_rounds: 30

settle:
  # 多条消息攒批：消息到了不立刻开工，判定"后面还有没有下文"，等窗口到点再开工
  enabled: true
  # 三档等待（秒）：明确指令/问题（判定一回来就开工）/ 可能有补充 / 话头碎片
  wait_clear: 0
  wait_maybe: 4
  wait_fragment: 15
  # 没启用 Jev 时的固定等待（秒，区间内随机）
  wait_default_min: 3
  wait_default_max: 4
  # 整批无论几条，最长等这么久（秒）
  wait_cap: 20

jev:
  # Jev 决策模型（System One 哑巴模型）：攒批档位判定 + 主动哨兵共用；
  # 不配 api_key = Jev 整个不启用（攒批走默认等待，主动性只剩闹钟）
  # 密钥也可以走环境变量 NEOAGENT_JEV_API_KEY
  api_key: ""
  base_url: https://opencode.ai/zen/v1/systemone
  model: jev-1.13-free

proactive:
  # 主动性：M 自己排的闹钟（schedule_wake，到点注入 <wake>）+ Jev 哨兵（配了 jev 才有）
  enabled: true
  # 免打扰时段（如 "23:30-08:00"）：只管哨兵的自主探测，闹钟照响
  quiet_hours: ""
  # 哨兵探测的节奏（秒）：刚活跃后隔这么久探一次，静默越久越稀，最稀到 probe_idle_max
  probe_active_min: 600
  probe_idle_max: 5400

limits:
  # 一次回复内最多连续调用多少轮工具（防失控）
  max_tool_rounds: 90
  # 记忆上下文的 token 预算：从最老端成组裁掉到装进预算
  history_token_budget: 250000

advanced:
  # 工作台：neoagent 的工作目录（工具的默认目录、产出物落脚点）
  workspace: data/workspace
  # 模型请求落盘（调试用，每会话一份 md 只留最新一次请求）；置空关闭
  modellog_dir: data/modellog
  # 每张图估算 token（计数器用）
  image_token_estimate: 1024
  # 气泡连发间隔（秒）：多条消息之间的随机停顿，给阅读时间；0 = 不间隔
  bubble_gap: [0.5, 1.5]
  media:
    max_bytes: 20971520          # 附件大小上限（20MB）
    max_images_per_message: 4
    download_quoted_media: false # 引用里的媒体默认不下载
  asr:
    provider: xiaomi-mimo        # 语音转写供应商（可拆换）
    api_key: ""                  # 或环境变量 NEOAGENT_ASR_API_KEY
    base_url: https://api.xiaomimimo.com/v1
    model: mimo-v2.5-asr
    language: auto
    max_audio_seconds: 300
  safety:
    # 文件读写允许的根目录（可写 ~ 或绝对路径；想收紧就改这里）
    files_roots: ["~"]
    # 命令执行允许的工作目录范围
    exec_roots: ["~"]
    exec_timeout: 60             # 单条命令超时（秒）
    exec_max_output: 20000       # 输出超长截断
    # 命中即拒绝的危险命令（正则；弱防线但必须有，别当唯一防线）
    deny_patterns:
      - "\\bsudo\\b"
      - "\\brm\\s+-rf\\b"
      - "\\bmkfs\\b"
      - "\\bdd\\s+of=/dev"
      - "\\bshutdown\\b"
      - "\\breboot\\b"
      - ":\\(\\)\\s*\\{"

# 频道在 channels/ 目录里，一个频道一个文件（聊天/控制台里 /connect 会自动生成）。
